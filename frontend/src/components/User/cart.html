<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - TechZone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="bg-dark text-white py-2">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <a href="index.html" class="text-white text-decoration-none">
                        <i class="fas fa-laptop-code me-2"></i> TechZone
                    </a>
                </div>
                <nav>
                    <a href="category.html" class="text-white me-3 text-decoration-none">Sản phẩm</a>
                    <a href="cart.html" class="text-white text-decoration-none">
                        <i class="fas fa-shopping-cart me-1"></i> Giỏ hàng
                        <span id="cart-count" class="badge bg-primary">0</span>
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <h2 class="mb-4">Giỏ hàng của bạn</h2>
                <div id="cartItems">
                    <!-- Cart items will be dynamically added here -->
                </div>
            </div>

            <!-- Order Summary -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Tóm tắt đơn hàng</h5>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                Tổng tiền:
                                <span id="subtotal">0 VNĐ</span>
                            </li>
                            <li class="list-group-item">
                                <div class="input-group">
                                    <input type="text" class="form-control" id="couponCode" placeholder="Mã giảm giá">
                                    <button class="btn btn-secondary" type="button" onclick="applyCoupon()">Áp
                                        dụng</button>
                                </div>
                            </li>
                            <li
                                class="list-group-item d-flex justify-content-between align-items-center text-success">
                                Giảm giá:
                                <span id="discount">0 VNĐ</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                Phí vận chuyển:
                                <span>Miễn phí</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center fw-bold">
                                Tổng cộng:
                                <span id="total">0 VNĐ</span>
                            </li>
                        </ul>
                        <div class="d-grid gap-2">
                            <button class="btn btn-primary" type="button">
                                <i class="fas fa-check me-2"></i> Thanh toán
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p>&copy; 2024 TechZone. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadCart);

        function formatPrice(price) {
            return price.toLocaleString('vi-VN', { style: 'currency', currency: 'VND' });
        }

        function updateSummary(total) {
            document.getElementById('subtotal').textContent = formatPrice(total);
            document.getElementById('total').textContent = formatPrice(total);
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('cart'));
            if (cart && cart.items && cart.items.length > index) {
                cart.items.splice(index, 1);
                localStorage.setItem('cart', JSON.stringify(cart));
                loadCart();
            }
        }
        function loadCart() {
    const cart = JSON.parse(localStorage.getItem('cart'));
    const cartItemsContainer = document.getElementById('cartItems');
    
    if (!cart || !cart.items || cart.items.length === 0) {
        cartItemsContainer.innerHTML = `
            <div class="text-center py-5">
                <i class="fas fa-shopping-cart fa-3x text-muted mb-3"></i>
                <h5>Giỏ hàng trống</h5>
                <p class="text-muted">Hãy thêm sản phẩm vào giỏ hàng để tiếp tục mua sắm</p>
                <a href="category.html" class="btn btn-primary">
                    <i class="fas fa-shopping-bag me-2"></i>Mua sắm ngay
                </a>
            </div>
        `;
        updateSummary(0);
        return;
    }

    let cartHTML = '';
    let total = 0;

    cart.items.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        
        cartHTML += `
            <div class="row align-items-center border-bottom py-3">
                <div class="col-md-2">
                    <div class="bg-light d-flex align-items-center justify-content-center rounded" style="height: 80px;">
                        <i class="${item.product.thumbnail} fa-2x text-muted"></i>
                    </div>
                </div>
                <div class="col-md-4">
                    <h6 class="mb-1">${item.product.name}</h6>
                    <small class="text-muted">Phiên bản: ${item.variant.variant_name}</small>
                    <div class="mt-1">
                        <small class="text-muted">SKU: ${item.variant.sku}</small>
                    </div>
                    <div class="mt-1">
                        <span class="badge bg-success">Còn ${item.variant.quantity} sản phẩm</span>
                    </div>
                </div>
                <div class="col-md-2 text-center">
                    <span class="fw-bold text-danger">${formatPrice(item.price)}</span>
                </div>
                <div class="col-md-2">
                    <div class="input-group input-group-sm">
                        <button class="btn btn-outline-secondary" onclick="updateQuantity(${index}, -1)">
                            <i class="fas fa-minus"></i>
                        </button>
                        <input type="text" class="form-control text-center" value="${item.quantity}" readonly>
                        <button class="btn btn-outline-secondary" onclick="updateQuantity(${index}, 1)" ${item.quantity >= item.variant.quantity ? 'disabled' : ''}>
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </div>
                <div class="col-md-1 text-center">
                    <span class="fw-bold">${formatPrice(itemTotal)}</span>
                </div>
                <div class="col-md-1 text-center">
                    <button class="btn btn-sm btn-outline-danger" onclick="removeItem(${index})" title="Xóa sản phẩm">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
        `;
    });

    cartItemsContainer.innerHTML = cartHTML;
    updateSummary(total);
}

function updateQuantity(index, change) {
    let cart = JSON.parse(localStorage.getItem('cart'));
    
    if (cart && cart.items[index]) {
        const newQuantity = cart.items[index].quantity + change;
        
        if (newQuantity <= 0) {
            cart.items.splice(index, 1);
        } else if (newQuantity <= cart.items[index].variant.quantity) {
            cart.items[index].quantity = newQuantity;
        } else {
            alert(`Chỉ còn ${cart.items[index].variant.quantity} sản phẩm trong kho`);
            return;
        }
        
        localStorage.setItem('cart', JSON.stringify(cart));
        loadCart();
    }
}

function applyCoupon() {
    const couponCode = document.getElementById('couponCode').value.trim();
    
    if (!couponCode) {
        alert('Vui lòng nhập mã giảm giá');
        return;
    }

    // Simulate voucher validation based on database structure
    const validVouchers = {
        'TECHZONE10': {
            id: 1,
            code: 'TECHZONE10',
            description: 'Giảm 10% cho đơn hàng',
            discount_amount: 0.1,
            min_order_value: 1000000,
            quantity: 100,
            start_at: '2024-01-01',
            end_at: '2024-12-31',
            created_at: new Date().toISOString(),
            updated_at: new Date().toISOString()
        },
        'NEWUSER': {
            id: 2,
            code: 'NEWUSER',
            description: 'Giảm 15% cho khách hàng mới',
            discount_amount: 0.15,
            min_order_value: 500000,
            quantity: 50,
            start_at: '2024-01-01',
            end_at: '2024-12-31',
            created_at: new Date().toISOString(),
            updated_at: new Date().toISOString()
        }
    };

    const voucher = validVouchers[couponCode.toUpperCase()];
    if (voucher) {
        const cart = JSON.parse(localStorage.getItem('cart'));
        const subtotal = cart.items.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        
        if (subtotal >= voucher.min_order_value) {
            alert(`Áp dụng mã giảm giá thành công! Giảm ${voucher.discount_amount * 100}%`);
            
            const discountAmount = subtotal * voucher.discount_amount;
            document.getElementById('discount').textContent = '-' + formatPrice(discountAmount);
            document.getElementById('total').textContent = formatPrice(subtotal - discountAmount);
            
            // Store applied voucher
            localStorage.setItem('appliedVoucher', JSON.stringify(voucher));
        } else {
            alert(`Đơn hàng tối thiểu ${formatPrice(voucher.min_order_value)} để sử dụng mã này`);
        }
    } else {
        alert('Mã giảm giá không hợp lệ hoặc đã hết hạn');
    }
}
    </script>
</body>

</html>
