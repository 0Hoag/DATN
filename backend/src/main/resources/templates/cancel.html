<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đơn hàng đã bị hủy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f9f9f9;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #e53935;
        }

        .order-info {
            font-size: 18px;
            font-weight: bold;
            color: #444444;
            margin-bottom: 10px;
        }

        .message {
            margin-top: 20px;
            font-size: 16px;
            color: #666666;
        }

        .reason {
            margin-top: 10px;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Đơn hàng của bạn đã bị hủy</h1>
        <p class="order-info">Mã đơn hàng: <span th:text="${orderId}"></span></p>

        <!-- Hiển thị lý do hủy nếu có -->
        <p class="reason" th:if="${!#strings.isEmpty(reason)}">
            Lý do hủy: <span th:text="${reason}"></span>
        </p>

        <p class="message">
            Chúng tôi xin lỗi vì sự bất tiện này. Nếu bạn có bất kỳ câu hỏi nào, vui lòng liên hệ bộ phận hỗ trợ khách hàng.
        </p>
        <p class="message">
            Cảm ơn bạn đã quan tâm đến PhoneZone Store.
        </p>
    </div>
</body>
</html>
